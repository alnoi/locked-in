name: trackit-edge
services:
  proxy:
    image: ${NGINX_IMAGE:?}
    container_name: track-it-proxy
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    pids_limit: 128
    mem_limit: 192m
    cpus: 1
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
      - /tmp:size=8m
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./guard.js:/etc/nginx/guard.js:ro
      - ./protected.conf:/etc/nginx/protected.conf:ro
      - ./certificates:/etc/letsencrypt:ro
      - ./webroot:/var/www/certbot:ro
      - ./logs:/var/log/nginx
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 3 -O /dev/null http://127.0.0.1:8081/livez"]
      interval: 15s
      timeout: 4s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
