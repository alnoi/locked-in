user nginx;
worker_processes 1;
events { worker_connections 128; }
http {
  server_tokens off;
  server {
    listen 80 default_server;
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
    }
    location / { return 503; }
  }
}
