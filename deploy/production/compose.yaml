name: trackit
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  backend:
    container_name: track-it-backend
    image: ${TRACKIT_IMAGE:?}
    restart: unless-stopped
    network_mode: host
    env_file: ${TRACKIT_ROOT:?}/.env
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://$$SERVER_ADDRESS/readyz"]
      interval: 3s
      timeout: 4s
      start_period: 10s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  postgres_data:
    name: trackit_postgres_data
