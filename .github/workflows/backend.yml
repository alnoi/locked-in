name: Backend build and deploy
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/production/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/production/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  IMAGE_NAME: ghcr.io/alnoi/locked-in-backend
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: backend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Deploy immutable image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$REGISTRY_USER" =~ ^[a-zA-Z0-9-]+$ ]]
          ssh_directory="$(mktemp -d)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_directory/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          options=(-i "$ssh_directory/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_directory/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          cleanup() {
            ssh "${options[@]}" -p "$DEPLOY_PORT" "$remote" "rm -f trackit/registry/$GITHUB_SHA/config.json; rmdir trackit/registry/$GITHUB_SHA 2>/dev/null || true" || true
            rm -f "$ssh_directory/key" "$ssh_directory/known_hosts"
            rmdir "$ssh_directory"
          }
          trap cleanup EXIT
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$remote" "umask 077; mkdir -p trackit/releases/$GITHUB_SHA trackit/registry/$GITHUB_SHA"
          scp "${options[@]}" -P "$DEPLOY_PORT" deploy/production/compose.yaml deploy/production/deploy.sh "$remote:trackit/releases/$GITHUB_SHA/"
          printf '%s' "$REGISTRY_TOKEN" | ssh "${options[@]}" -p "$DEPLOY_PORT" "$remote" "DOCKER_CONFIG=\$HOME/trackit/registry/$GITHUB_SHA docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$remote" "DOCKER_CONFIG=\$HOME/trackit/registry/$GITHUB_SHA bash trackit/releases/$GITHUB_SHA/deploy.sh '$IMAGE_NAME@$IMAGE_DIGEST'"
